; =============================================================================
; platformio.ini — Dataset Collector
; =============================================================================
;
; CATATAN STRUKTUR:
;   src_dir     = src       (main.cpp)
;   include_dir = include   (Config.h, DataModels.h, dst.)
;   lib_dir     = lib       (HealthSensors, Network, dst.)
;
; Setiap env = satu unit ESP32 dengan NODE_ID unik.
; NODE_ID dipakai sebagai identifier di MQTT topic:
;   health_monitor/node_<NODE_ID>/raw
; =============================================================================

[platformio]
src_dir     = src
include_dir = include
lib_dir     = lib

[env]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
lib_ldf_mode  = deep+

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1


; ---------------------------------------------------------------------------
; Node 1 — ESP32 pertama
; ---------------------------------------------------------------------------
[env:node_1]
build_flags =
    ${env.build_flags}
    -DNODE_ID=1

; ---------------------------------------------------------------------------
; Node 2 — ESP32 kedua (opsional, untuk multi-node dataset)
; ---------------------------------------------------------------------------
[env:node_2]
build_flags =
    ${env.build_flags}
    -DNODE_ID=2

; ---------------------------------------------------------------------------
; Node 3 — ESP32 ketiga (opsional)
; ---------------------------------------------------------------------------
[env:node_3]
build_flags =
    ${env.build_flags}
    -DNODE_ID=3